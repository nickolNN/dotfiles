services:
  agent:
    build:
      context: ..
      dockerfile: dotfiles-agent/Dockerfile
      args:
        AGENT_UID: "${AGENT_UID:-1000}"
        AGENT_GID: "${AGENT_GID:-1000}"
    image: dotfiles-agent
    container_name: dotfiles-agent
    command: sleep infinity
    volumes:
      - "${WORKSPACE:-.}:/home/agent/workspace"
      # .ssh is dir->dir and safe even if missing (Docker auto-creates it).
      # NOTE: .gitconfig mount removed — a missing host file makes Docker
      # create a DIRECTORY that can't mount over the image's baked-in
      # ~/.gitconfig file (OCI "not a directory"). Pass git identity via
      # `docker exec ... git config` instead.
      - "${HOME}/.ssh:/home/agent/.ssh:ro"
      - agent-sessions:/home/agent/.pi/agent/sessions
      # Long-term memory: ONE volume shared by every room, so all agents
      # (and all repos) share a single brain — see README "Long-term memory".
      - agent-memory:/home/agent/.pi/agent/memory
      # Durable caches: npm cache, jest cache (TMPDIR), qmd models.
      - agent-cache:/home/agent/.cache
      # node_modules shadowing: this declarative alternative keeps the
      # old tmpfs shadow (safe but throwaway). The primary path —
      # spawn-pi-agent.sh / attach.sh — mounts a PERSISTENT per-room
      # volume (agent-node-modules-<container>, nocopy) instead; compose
      # cannot express per-room volume names (no top-level key
      # interpolation), so add a long-syntax volume with nocopy: true by
      # hand if you need compose + persistence for one room.
    tmpfs:
      - /home/agent/workspace/node_modules:exec,uid=${AGENT_UID:-1000},gid=${AGENT_GID:-1000},mode=755
    mem_limit: ${AGENT_MEMORY_LIMIT:-10g}
    ports: []
    stdin_open: true
    tty: true

volumes:
  agent-sessions:
  agent-memory:
  agent-cache:
