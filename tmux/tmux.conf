# tmux prefix key to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# New: Bind Ctrl-a to launch Herdr directly if no session is active, or switch to it
bind C-a run-shell "herdr"

set -g default-terminal "alacritty"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-features ",alacritty:usstyle:sync"
set -g base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g status-position top
set -g focus-events on
set -g mouse on

# Forward modified Enter keys (Shift+Enter, Ctrl+Enter, Alt+Enter) to
# applications that request extended key reporting (e.g. Pi, Neovim).
# csi-u format is the recommended tmux setup (tmux 3.5+).
set -g extended-keys on
set -g extended-keys-format csi-u

bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -h -c "#{pane_current_path}"
bind % split-window -v -c "#{pane_current_path}"

set-option -s escape-time 0

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '/opt/homebrew/opt/tpm/share/tpm/tpm'

# ---- Status bar: hackerman theme ----
# neon #39ff14  mint #8affc1  teal #17f5d3  text #d7ffe0
# muted #a5c9b8  bg #0b1210  dim #2e3b35

set -g status-style 'bg=#0b1210,fg=#a5c9b8'
set -g status-left-length 60
set -g status-right-length 120

# left: session name as a neon pill (spaces add padding)
set -g status-left ' #[fg=#0b1210,bg=#39ff14,bold]  #S  #[fg=#39ff14,bg=#0b1210] '
set -g status-left-style 'bg=#0b1210,fg=#39ff14'

# window list: inactive muted, active = neon pill with padding
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #[fg=#0b1210,bg=#39ff14,bold]  #I:#W  #[fg=#a5c9b8,bg=#0b1210]'
set -g window-status-style 'bg=#0b1210,fg=#a5c9b8'
set -g window-status-current-style 'bg=#39ff14,fg=#0b1210'
set -g window-status-separator ''

# right: git branch + hostname + clock
set -g status-interval 3
set -g status-right ' #[fg=#8affc1]#(~/.config/tmux/heading.sh "#{pane_current_path}")#[fg=#a5c9b8]  #[fg=#17f5d3]#h #[fg=#a5c9b8]  #[fg=#d7ffe0]%H:%M '
set -g status-right-style 'bg=#0b1210,fg=#d7ffe0'

# messages, prompts, pane borders
set -g message-style 'bg=#122018,fg=#d7ffe0'
set -g message-command-style 'bg=#122018,fg=#d7ffe0'
set -g pane-active-border-style 'fg=#39ff14'
set -g pane-border-style 'fg=#2e3b35'

# ── Dynamic headings ────────────────────────────────────────────
# Window titles track the foreground process (terminal-escape driven).
set -g automatic-rename on
set -g set-titles on
set -g allow-rename on