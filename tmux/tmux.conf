# tmux prefix key to Ctrl-a
unbind C-b
set -g prefix C-a
bind a send-prefix

set -g default-terminal "alacritty"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-features ",alacritty:usstyle:sync"
set -g base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g status-position top
set -g focus-events on

# Forward modified Enter keys (Shift+Enter, Ctrl+Enter, Alt+Enter) to
# applications that request extended key reporting (e.g. Pi, Neovim).
# csi-u format is the recommended tmux setup (tmux 3.5+).
set -g extended-keys on
set -g extended-keys-format csi-u

bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -h -c "#{pane_current_path}"
bind % split-window -v -c "#{pane_current_path}"

set-option -s escape-time 0

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'fabioluciano/tmux-powerkit'

set -g @powerkit_plugins ''
set -g @powerkit_transparent 'true'
set -g @powerkit_theme "hackerman"
set -g @powerkit_theme_variant "default"

run '/opt/homebrew/opt/tpm/share/tpm/tpm'
